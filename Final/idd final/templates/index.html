<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inner Constellation Viewer</title>

<style>
    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        color: white;
        overflow: hidden;
    }


    #viewer {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
    }


    #stream {
        max-width: 100%;
        max-height: 100%;
        object-fit: cover;       
        border-radius: 8px;
    }


    #sidebar {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 12px 18px;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(6px);
        border-radius: 10px;
        color: #eee;
        font-size: 18px;
        line-height: 1.4;
    }
</style>
</head>
<body>

<div id="sidebar">
    <div style="font-size: 22px; font-weight: bold;">Inner Constellation</div>
    <div style="font-size: 15px; opacity: 0.7;">Live Interactive Energy Field</div>
</div>

<div id="viewer">
    <img id="stream" src="/frame" />
</div>

</body>
</html>
